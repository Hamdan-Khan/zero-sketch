[package]
name = "zerosketch-api"
edition = { workspace = true }

[dependencies]
aws-config = "1.10.1"
aws-sdk-s3 = "1.141.0"
axum = { workspace = true, features = ["multipart"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { workspace = true, features = ["full"] }
tower = { version = "0.5.3", features = ["util", "timeout"] }
tower-http = { version = "0.7.0", features = [
  "add-extension",
  "trace",
  "cors",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
